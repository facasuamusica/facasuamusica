<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faça Sua Música — Em breve</title>
<meta name="description" content="Estamos afinando os últimos detalhes. Em breve você vai poder criar uma música personalizada com a história de quem você ama.">
<meta property="og:title" content="Faça Sua Música — Em breve">
<meta property="og:description" content="Estamos afinando os últimos detalhes. Em breve, a música que ela nunca vai esquecer.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0b0711;
    --surface:   #191026;
    --line:      #2e2140;
    --text:      #f4eefb;
    --text-soft: #b9a9cc;
    --text-dim:  #8b7aa0;
    --brand:     #ff5d8f;
    --brand-2:   #ffb057;
    --brand-3:   #a06bff;
    --grad: linear-gradient(115deg, #ff5d8f 0%, #ff7a6b 45%, #ffb057 100%);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  h1 { margin: 0; line-height: 1.12; letter-spacing: -.02em; }
  p { margin: 0; }
  svg { display: block; }
  ::selection { background: var(--brand); color: #fff; }

  /* brilho ambiente de fundo */
  body::before {
    content: '';
    position: fixed;
    inset: -30% -10% auto -10%;
    height: 70vh;
    background:
      radial-gradient(closest-side, rgba(255,93,143,.18), transparent 70%) 20% 40%/60% 100% no-repeat,
      radial-gradient(closest-side, rgba(160,107,255,.16), transparent 70%) 80% 20%/55% 100% no-repeat;
    filter: blur(10px);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    text-align: center;
  }

  /* ---------- logo ---------- */
  .logo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 38px;
  }
  .logo__mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--grad);
    color: #2a0c18;
  }
  .logo__mark svg { width: 21px; height: 21px; }
  .logo__text {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .logo__text strong { font-weight: 800; }

  /* ---------- selo ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 15px 7px 12px;
    margin-bottom: 26px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.03);
    color: var(--text-soft);
    font-size: 13.5px;
    font-weight: 500;
  }

  /* equalizador animado */
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 14px; }
  .eq span {
    width: 3px;
    border-radius: 2px;
    background: var(--brand);
    animation: eq 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1) { height: 40%; animation-delay: -.9s; }
  .eq span:nth-child(2) { height: 95%; animation-delay: -.5s; background: var(--brand-2); }
  .eq span:nth-child(3) { height: 62%; animation-delay: -.2s; background: var(--brand-3); }
  @keyframes eq {
    0%, 100% { transform: scaleY(.35); }
    50%      { transform: scaleY(1); }
  }

  /* ---------- texto ---------- */
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 7vw, 3.3rem);
    font-weight: 700;
  }
  h1 em {
    display: block;
    font-style: italic;
    font-weight: 500;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lead {
    max-width: 46ch;
    margin: 20px auto 0;
    color: var(--text-soft);
    font-size: clamp(1rem, 2.4vw, 1.09rem);
  }

  /* ---------- rodapé ---------- */
  .foot {
    margin-top: 40px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .foot a {
    color: var(--text-soft);
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .foot a:hover,
  .foot a:focus-visible { color: var(--brand); border-bottom-color: var(--brand); }
  .foot .sep { color: var(--line); }

  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; transform: scaleY(.7); }
  }
</style>
</head>
<body>

<main class="card">

  <a class="logo" href="/" aria-label="Faça Sua Música — página inicial">
    <span class="logo__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="2"/></svg>
    </span>
    <span class="logo__text">Faça<strong>Sua</strong>Música</span>
  </a>

  <p class="badge">
    <span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>
    Site em desenvolvimento
  </p>

  <h1>
    Estamos afinando
    <em>os últimos detalhes.</em>
  </h1>

  <p class="lead">
    Em breve você vai poder contar a sua história e receber, em minutos, uma
    música personalizada com o nome e as manias de quem você ama.
  </p>

  <div class="foot">
    <a href="/site">Ver prévia do site</a>
  </div>

</main>

</body>
</html>
